<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 671 107" role="img" aria-labelledby="title">
  <title id="title">Polygrande</title>
  <defs>
    <filter id="logo-mask-filter" color-interpolation-filters="sRGB">
      <feColorMatrix
        type="matrix"
        values="
          0.2126 0.7152 0.0722 0 0
          0.2126 0.7152 0.0722 0 0
          0.2126 0.7152 0.0722 0 0
          0      0      0      1 0"
      />
      <feComponentTransfer>
        <feFuncR type="table" tableValues="1 0" />
        <feFuncG type="table" tableValues="1 0" />
        <feFuncB type="table" tableValues="1 0" />
      </feComponentTransfer>
    </filter>
    <mask id="logo-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="671" height="107" style="mask-type:luminance">
      <image
        href="polygrande-logo.png"
        width="671"
        height="107"
        preserveAspectRatio="xMinYMin meet"
        filter="url(#logo-mask-filter)"
      />
    </mask>
  </defs>

  <rect width="671" height="107" fill="#ffffff" mask="url(#logo-mask)" />
</svg>
